# Runs test-snyk-demo/reusable-workflows/.github/workflows/go-ci.yaml@v1: lint, tests, Snyk Open Source + Code.
# Needs secret SNYK_TOKEN (without it the Snyk scan is skipped with a warning).
name: CI
on:
  push:
    branches: [main, "hotfix/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  security-events: write
  pull-requests: write
  packages: write
jobs:
  ci:
    uses: test-snyk-demo/reusable-workflows/.github/workflows/go-ci.yaml@v1
    with:
      snyk-org: test-snyk-demo
    secrets:
      snyk-token: ${{ secrets.SNYK_TOKEN }}
